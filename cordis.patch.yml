# dsh-doctor：两个案例库 + 体检历史，一个 bundle 层，不覆盖任何宿主执行器。
# 注意：`name` 是**包名**（解析用），`id` 才是稳定的 entry id（客户端按包名登记模块，两者别混）。
- insert:
    - id: dsh-doctor
      name: '@qweit-crystal/dsh-doctor'
      # 设置栏里显示的名字（客户端读 entry.options.label；宿主不认时会回退显示 id）
      label: 贡献病例
      config:
        # 体检范围上限（防止在超大目录上扫到天荒地老）
        maxProfiles: 32
        maxLogBytes: 2097152
        httpTimeoutMs: 1200
        cacheTtlMs: 15000

        # 案例库：shared = 随包分发（只读）；local = 本机沉淀（唯一可写）
        # sharedCasesDir: <默认值即包内 docs/cases>
        # localCasesDir: <默认值 $DSH_HOME/dsh-doctor/cases>
        casesPrefer: local        # 同名 id 时 local 优先（本地覆盖共享）
        allowLocalCaseWrite: true # 想彻底只读就设 false

        # 体检历史（第二个写点）：每轮结论落到 $DSH_HOME/dsh-doctor/runs/
        saveRuns: true            # 设 false 回到纯只读（doctor_runs 会变空）
        runsRetention: 30         # 保留最近多少条，超出删最旧的

        # 升级前体检：对桌面端安装目录做"写空文件再删"的真探针（**写操作**，默认关）
        # 为什么不用 fs.access(W_OK)：Windows 上它看只读属性而不是 ACL，永远报可写。
        deepWriteProbe: false

        # 会话界面右上角的「体检」小徽章（有问题时变色；设 false 隐藏）
        headerBadge: true

        # 会话层检查（0.5.0）：只读最近一个会话的尾部，统计"空回合/重复坍缩"，不输出正文
        sessionScan: true
        deepSessions: false       # true = 扫最近 24h 内所有会话（每个尾部 2MB），更慢
